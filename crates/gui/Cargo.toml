[package]
name = "tidepool-gui"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# Its row of the dependency matrix (docs/01-architecture.md) allows `core`,
# `platform`, `codec`, `gfx`, `font` and `ui`. The first frame (M2.6) uses
# `platform`'s window, `gfx` to draw, `font` to set text, and `core`'s
# geometry and colors.
[dependencies]
tidepool-core = { path = "../core" }
tidepool-platform = { path = "../platform" }
tidepool-gfx = { path = "../gfx" }
tidepool-font = { path = "../font" }
tidepool-ui = { path = "../ui" }

[lints]
workspace = true

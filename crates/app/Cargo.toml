[package]
name = "tidepool"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# Its row of the dependency matrix (docs/01-architecture.md) allows every
# crate above it. The first frame (M2.6) uses `core` to read the command
# line, `platform` for the window's configuration, and `gui` to open the
# window and draw.
[dependencies]
tidepool-core = { path = "../core" }
tidepool-platform = { path = "../platform" }
tidepool-gui = { path = "../gui" }

[lints]
workspace = true

[package]
name = "tidepool-bench"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# Its row of the dependency matrix (docs/01-architecture.md) allows any
# workspace crate: `core` parses the command line and makes the inputs,
# `codec` reads and writes the baseline, `text`, `font`, `ui` and `editor`
# are what the suites measure, `gui` measures `ui`'s text as the window
# does and paints the editor view's frames into `gfx`'s framebuffers,
# `workspace` opens the 100 MB file of its suite, and `text` saves the
# baseline atomically.
[dependencies]
tidepool-core = { path = "../crates/core" }
tidepool-codec = { path = "../crates/codec" }
tidepool-text = { path = "../crates/text" }
tidepool-font = { path = "../crates/font" }
tidepool-gfx = { path = "../crates/gfx" }
tidepool-ui = { path = "../crates/ui" }
tidepool-gui = { path = "../crates/gui" }
tidepool-editor = { path = "../crates/editor" }
tidepool-workspace = { path = "../crates/workspace" }

[lints]
workspace = true

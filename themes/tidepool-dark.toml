# tidepool-dark: Tidepool's default theme, in jabbott.dev's design language
# (ADR-0004). The tokens and their values are docs/subsystems/ui-and-theme.md
# → Tokens, taken from jabbott.dev's `:root`; the format is ADR-0047's.
#
# `tidepool-ui` reads every table but `[contrast]`, which
# `cargo xtask theme` reads: it prints the contrast table of the spec and
# fails when a pair listed in `[[contrast.use]]` is below its minimum.
# A change here re-blesses the golden frames it changes, after review
# (docs/04-quality.md → "Golden frames").

version = 1
name = "tidepool-dark"

# Each color: `value`, in `core::color`'s syntax (`#rrggbb`, `#rrggbbaa` or
# `rgba(r,g,b,a)`); `solid`, for a translucent value only, the value
# composited over `bg`, for surfaces drawn without the backdrop and for the
# terminal UI; and `ansi`, the 256-color index the terminal UI falls back
# to.
[colors]
bg = { value = "#0b0c0d", ansi = 232 }
bg-raise = { value = "#121517", ansi = 233 }
panel = { value = "rgba(16,19,21,0.78)", solid = "#0f1113", ansi = 233 }
panel-solid = { value = "#14181a", ansi = 234 }
slate = { value = "#29353a", ansi = 236 }
slate-2 = { value = "#1b2326", ansi = 235 }
line = { value = "rgba(255,255,255,0.08)", solid = "#1f1f20", ansi = 234 }
line-2 = { value = "rgba(255,255,255,0.16)", solid = "#323334", ansi = 236 }
text = { value = "#eef2f3", ansi = 255 }
text-2 = { value = "#b3bdc1", ansi = 250 }
text-3 = { value = "#7d898e", ansi = 102 }
teal = { value = "#5ccbcb", ansi = 80 }
teal-hi = { value = "#8fe5e5", ansi = 116 }
teal-wash = { value = "rgba(92,203,203,0.10)", solid = "#131f20", ansi = 234 }
teal-glow = { value = "rgba(92,203,203,0.35)" }
amber = { value = "#f2c200", ansi = 220 }
amber-hi = { value = "#ffd84a", ansi = 221 }
green = { value = "#3ddc97", ansi = 42 }
rust = { value = "#f09a4a", ansi = 215 }
violet = { value = "#a58cff", ansi = 141 }
bronze = { value = "#cd7f32", ansi = 173 }
bronze-hi = { value = "#ffc98f", ansi = 222 }
purple = { value = "#9a6bff", ansi = 99 }
purple-hi = { value = "#e3d6ff", ansi = 189 }
error = { value = "#ff8a80", ansi = 210 }
editor-bg = { value = "#0a0f11", ansi = 233 }
bar = { value = "rgba(30,37,40,0.72)", solid = "#191e20", ansi = 234 }
on-amber = { value = "#111111" }
on-teal = { value = "#071012" }
comment = { value = "#6f7d82" }
# The controls' colors that jabbott.dev's components use beyond its
# `:root` (ADR-0049).
ghost = { value = "rgba(255,255,255,0.03)", solid = "#121314", ansi = 233 }
teal-line = { value = "rgba(92,203,203,0.55)", solid = "#387576", ansi = 66 }
teal-fill = { value = "rgba(92,203,203,0.20)", solid = "#1b3233", ansi = 235 }
slate-hi = { value = "#34444a", ansi = 238 }
teal-ring = { value = "rgba(92,203,203,0.15)", solid = "#17292a", ansi = 235 }
green-halo = { value = "rgba(61,220,151,0.16)", solid = "#132d23", ansi = 235 }
amber-halo = { value = "rgba(242,194,0,0.16)", solid = "#30290b", ansi = 235 }
error-halo = { value = "rgba(255,138,128,0.16)", solid = "#32201f", ansi = 235 }
# The collections' colors that jabbott.dev's table uses beyond its `:root`
# (ADR-0052): its header row, `slate` at 60%, and its rows' hover wash.
table-head = { value = "rgba(41,53,58,0.60)", solid = "#1d2528", ansi = 235 }
row-hover = { value = "rgba(255,255,255,0.025)", solid = "#111213", ansi = 233 }
# The card's tab and the code block's bar (`.card__tab`, `.code-bar`).
card-tab = { value = "#e8f3f3", ansi = 255 }
on-card-tab = { value = "#0b1416", ansi = 233 }
code-bar = { value = "rgba(41,53,58,0.45)", solid = "#181e21", ansi = 234 }
# The tiles' colors (ADR-0058): a lit tile's label, its accent mixed 55%
# with white; its border, the accent at 55%; and a coat of its corner
# glow, nine of which make the site's 16%.
neutral-label = { value = "#d5dbdd", ansi = 253 }
teal-label = { value = "#a5e2e2", ansi = 152 }
amber-label = { value = "#f8dd73", ansi = 221 }
neutral-line = { value = "rgba(179,189,193,0.55)", solid = "#676d70", ansi = 242 }
amber-line = { value = "rgba(242,194,0,0.55)", solid = "#8a7006", ansi = 94 }
neutral-haze = { value = "rgba(179,189,193,0.02)" }
teal-haze = { value = "rgba(92,203,203,0.02)" }
amber-haze = { value = "rgba(242,194,0,0.02)" }

# Lengths in logical units.
[sizes]
cut = 10

# Font families: the names of the bundled faces for chrome and for code.
# No frontend reads them yet; `gui` draws with the bundled faces directly.
[fonts]
font-ui = "Saira"
font-mono = "JetBrains Mono"

# The table `cargo xtask theme` prints: each `text` color on each surface
# (`on`), a translucent surface as its `solid` value over `bg`.
[contrast]
text = ["text", "text-2", "text-3", "teal", "amber", "error", "comment"]
on = ["bg", "editor-bg", "panel", "slate"]

# The pairs the theme uses for text. `size` is `normal` (at least 4.5:1)
# or `large` (at least 3:1, also for UI glyphs). A translucent surface is
# composited over `over`, or over `bg` when it is not given.

[[contrast.use]]
text = "text"
on = ["bg", "editor-bg", "panel", "slate"]
size = "normal"

# The editor's selection: `teal-glow` over `editor-bg` (#275152); its text
# stays `text`.
[[contrast.use]]
text = "text"
on = ["teal-glow"]
over = "editor-bg"
size = "normal"

# On `bar` too: the shell's status bar (M3.4, ADR-0060).
[[contrast.use]]
text = "text-2"
on = ["bg", "editor-bg", "panel", "slate", "bar"]
size = "normal"

# Not on `slate`: placeholder and muted text there use `text-2`. On
# `bar`: a status dot that is off, in the shell's status bar (M3.4).
[[contrast.use]]
text = "text-3"
on = ["bg", "editor-bg", "panel", "bar"]
size = "normal"

[[contrast.use]]
text = "teal"
on = ["bg", "editor-bg", "panel", "slate"]
size = "normal"

[[contrast.use]]
text = "amber"
on = ["bg", "editor-bg", "panel", "slate"]
size = "normal"

[[contrast.use]]
text = "error"
on = ["bg", "editor-bg", "panel", "slate"]
size = "normal"

# Code shown on other surfaces sits in an `editor-bg` well.
[[contrast.use]]
text = "comment"
on = ["editor-bg"]
size = "normal"

# Text on `amber`.
[[contrast.use]]
text = "on-amber"
on = ["amber"]
size = "normal"

# An active chip's label on its `teal` fill.
[[contrast.use]]
text = "on-teal"
on = ["teal"]
size = "normal"

# The controls' pairs (ADR-0049). A card's title at rest.
[[contrast.use]]
text = "text"
on = ["ghost"]
size = "normal"

# Hover and pressed labels, such as a hovered link's (a breadcrumb).
[[contrast.use]]
text = "teal-hi"
on = ["bg", "editor-bg", "panel", "ghost", "teal-wash", "teal-fill", "teal-glow", "slate-hi"]
size = "normal"

# Text on `amber-hi`.
[[contrast.use]]
text = "on-amber"
on = ["amber-hi"]
size = "normal"

# A pressed chip's label.
[[contrast.use]]
text = "teal"
on = ["slate-hi"]
size = "normal"

# A selected chip's label on its hover fill.
[[contrast.use]]
text = "on-teal"
on = ["teal-hi"]
size = "normal"

# Selected text in a field: `teal-glow` over `slate`.
[[contrast.use]]
text = "text"
on = ["teal-glow"]
over = "slate"
size = "normal"

# The collections' pairs (ADR-0052). A row's text, hovered or selected
# (`teal-glow`), in a list, tree view or table.
[[contrast.use]]
text = "text"
on = ["row-hover", "teal-glow"]
size = "normal"

# A table's column header at rest, and hovered or pressed.
[[contrast.use]]
text = "teal"
on = ["table-head"]
size = "normal"

[[contrast.use]]
text = "teal-hi"
on = ["table-head", "slate"]
size = "normal"

# A tree item's chevron, a UI glyph, on a hovered or selected row.
[[contrast.use]]
text = "text-2"
on = ["row-hover", "teal-glow"]
size = "large"

# A card's tab label on its pill, and a card's kicker and line of text on
# its `ghost` fill.
[[contrast.use]]
text = "on-card-tab"
on = ["card-tab"]
size = "normal"

[[contrast.use]]
text = "text-2"
on = ["ghost"]
size = "normal"

[[contrast.use]]
text = "text-3"
on = ["ghost"]
size = "normal"

# A code block's language and COPY on its bar, over `editor-bg`; COPY
# hovered and pressed.
[[contrast.use]]
text = "text-3"
on = ["code-bar"]
over = "editor-bg"
size = "normal"

[[contrast.use]]
text = "teal"
on = ["code-bar"]
over = "editor-bg"
size = "normal"

[[contrast.use]]
text = "teal-hi"
on = ["teal-wash", "teal-fill"]
over = "editor-bg"
size = "normal"

# A hovered tab's label.
[[contrast.use]]
text = "teal-hi"
on = ["row-hover"]
size = "normal"

# The overlays' pairs (M3.3). A tooltip's text on `panel-solid`, the spec's
# color for menus and tooltips.
[[contrast.use]]
text = "text"
on = ["panel-solid"]
size = "normal"

# A tile's label (ADR-0058), at rest and lit, on `panel` and its glow,
# its accent at about 16% (16.3%) where strongest: `line-2`, `teal-fill`
# and `amber-halo` over `panel-solid`, which is lighter than `panel`, are
# lighter still, as a test of `ui`'s button checks.
[[contrast.use]]
text = "text"
on = ["panel", "line-2", "teal-fill", "amber-halo"]
over = "panel-solid"
size = "normal"

[[contrast.use]]
text = "neutral-label"
on = ["panel", "line-2"]
over = "panel-solid"
size = "normal"

[[contrast.use]]
text = "teal-label"
on = ["panel", "teal-fill"]
over = "panel-solid"
size = "normal"

[[contrast.use]]
text = "amber-label"
on = ["panel", "amber-halo"]
over = "panel-solid"
size = "normal"

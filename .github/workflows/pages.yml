# Builds the demo page and publishes it at https://jabbott.dev/Tidepool/
# through GitHub Pages, each time CI passes on a push to main (ADR-0030).
# It is specified in docs/04-quality.md -> "CI (GitHub Actions)", under
# "Demo page". Ported from Nadir's pages.yml (its ADR-0029).
#
# Rules for this file, as for ci.yml, with the exceptions ADR-0030 makes
# (.claude/rules/ci-workflows.md):
# - Pin every action by its full commit SHA, with the tag in a comment.
#   Re-pin with:
#     git ls-remote --tags https://github.com/actions/<name> \
#       'refs/tags/vX.Y.Z' 'refs/tags/vX.Y.Z^{}'
#   using the peeled `^{}` SHA when the tag is annotated.
# - Use no actions other than actions/checkout and actions/cache, and
#   GitHub's two Pages actions, actions/upload-pages-artifact and
#   actions/deploy-pages.
# - Install the toolchain with rustup, not with an action.
# - Pause workflow commands in every step that reads the checkout or runs
#   its code, as ci.yml does.
# - Only the deploy job may write, and only to Pages; it checks nothing out
#   and runs none of the repository's code.
#
# The repository's Pages source must be "GitHub Actions" (Settings, Pages).

name: Pages

on:
  # After CI. This runs the file as main has it; the gate takes only a
  # successful run of a push to this repository's main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # By hand, from main: to publish main again after a run of this workflow
  # failed for a reason of its own. The gate still asks for a successful CI
  # run of main's commit.
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Decides whether this run publishes, before it waits for any other: a run
  # that does not publish never holds a place in the queues below, and so
  # never displaces one that does.
  gate:
    name: Decide
    if: >-
      github.repository == 'jabbott-iii/Tidepool' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To find CI's runs of the commit, for a run by hand.
      actions: read
    outputs:
      commit: ${{ steps.current.outputs.commit }}
      current: ${{ steps.current.outputs.current }}
      # The attempt that decided. A re-run of only the failed jobs reuses
      # the outputs of the jobs that passed, so the jobs below run only in
      # the attempt whose gate let them through: "Re-run all jobs", which
      # decides again, or a run by hand, is how to retry.
      attempt: ${{ github.run_attempt }}
    steps:
      # When main has moved on, the run for the newer commit publishes the
      # page, so this one does not put an older page over it. A run by hand
      # publishes only a commit that CI passed, as the page says. This step
      # reads no checkout and runs none of the repository's code; the
      # commit comes from the event, through `env`, and must be a hash.
      - name: Check that the commit is still main's, and passed CI
        id: current
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the commit to publish is not a 40-digit hash"
            exit 1
          fi
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          passed=1
          if [ "$EVENT" = workflow_dispatch ]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&event=push&status=success&branch=main" --jq .total_count)
          fi
          if [ "$main" != "$COMMIT" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at $main, past $COMMIT: its own run publishes the page."
          elif [ "$passed" = 0 ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI has not passed on main's $COMMIT, so the page stays as it is."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the page
    needs: gate
    if: needs.gate.outputs.current == 'true' && needs.gate.outputs.attempt == github.run_attempt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # One build at a time, in the order the gate let them through. A build
    # that waits is replaced by the next one let through, a newer commit's.
    concurrency:
      group: pages-build
      cancel-in-progress: false
    env:
      # As in ci.yml: the workspace has no third-party package, so cargo
      # never needs the network.
      CARGO_NET_OFFLINE: "true"
      RUST_BACKTRACE: 1
    outputs:
      current: ${{ steps.current.outputs.current }}
      attempt: ${{ github.run_attempt }}
    steps:
      # It may have waited: check again.
      - name: Check that the commit is still main's
        id: current
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main" = "$COMMIT" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at $main, past $COMMIT: its own run publishes the page."
          fi

      # The commit CI passed, not whatever main is by now.
      - name: Check out
        if: steps.current.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false

      # Workflow commands are paused in this step and the next run: step, as
      # in ci.yml, so nothing they print is read as one: not rustup quoting
      # rust-toolchain.toml, the commit's subject, a file name in a check's
      # message, or a test's output (docs/04-quality.md -> "CI").
      # - Each step makes its own token, never exported; only it resumes them.
      # - From the stop line on, stderr joins stdout (bash's own messages
      #   too): the runner reads the two pipes apart and does not keep them
      #   in order.
      # - A pause ends with its step, so a step that fails needs no resume.
      - name: Install the pinned toolchain
        if: steps.current.outputs.current == 'true'
        run: |
          unset token
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          if [ "${#token}" -ne 32 ] || [[ "$token" == *[!0-9a-f]* ]]; then
            echo "no token to pause workflow commands with" >&2
            exit 1
          fi
          exec 2>&1
          echo "::stop-commands::${token}"
          rustup set profile minimal
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose
          cargo fmt --version
          cargo clippy --version
          echo "::${token}::"

      # CI's cache, by ci.yml's key: this job runs on main, so it restores
      # what CI's Linux run of a push to main saved, and never a pull
      # request's (GitHub's docs, "Dependency caching").
      - name: Cache Cargo home and target
        if: steps.current.outputs.current == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-

      # Paused as the toolchain step is (above). `git log` reads the
      # checked-out commit's hash, committer date and subject; they are set
      # for `cargo xtask site` alone, never in $GITHUB_ENV or $GITHUB_OUTPUT,
      # where the subject could reach later steps. `site` checks each.
      - name: Build the page
        if: steps.current.outputs.current == 'true'
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          unset token
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          if [ "${#token}" -ne 32 ] || [[ "$token" == *[!0-9a-f]* ]]; then
            echo "no token to pause workflow commands with" >&2
            exit 1
          fi
          exec 2>&1
          echo "::stop-commands::${token}"
          commit="$(git log -1 --format=%H)"
          if [ "$commit" != "$COMMIT" ]; then
            echo "the checkout is not the commit the gate let through"
            exit 1
          fi
          date="$(git log -1 --format=%cs)"
          subject="$(git log -1 --format=%s)"
          TIDEPOOL_SITE_COMMIT="$commit" TIDEPOOL_SITE_DATE="$date" TIDEPOOL_SITE_SUBJECT="$subject" cargo xtask site
          echo "::${token}::"

      # Named for the attempt: an artifact belongs to the whole run, and
      # deploy-pages refuses two of one name.
      - name: Upload the page
        if: steps.current.outputs.current == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site
          name: github-pages-${{ github.run_attempt }}

  deploy:
    name: Publish the page
    needs: build
    if: needs.build.outputs.current == 'true' && needs.build.outputs.attempt == github.run_attempt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    # Its own queue, so that a deploy that waits never displaces a build.
    # Deploys queue in the order the builds ran, which is the order of
    # main's commits; one that waits is replaced by the next, a newer
    # commit's.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

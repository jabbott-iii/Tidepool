# Code scanning: CodeQL reads the Rust code and these workflows for security
# problems, and reports what it finds in the repository's Security tab
# (docs/04-quality.md -> "CI (GitHub Actions)"; ADR-0022).
#
# - Only actions/checkout and GitHub's CodeQL action (init and analyze), each
#   pinned by full commit SHA with its release tag in a comment. Re-pin with:
#     git ls-remote --tags https://github.com/<owner>/<repo> \
#       'refs/tags/vX.Y.Z' 'refs/tags/vX.Y.Z^{}'
#   using the peeled `^{}` SHA when the tag is annotated, as CodeQL's are.
# - Only the analysis job may write, and only its results to code scanning.
# - No `run:` steps. A step added here that runs commands keeps them
#   paused, as ci.yml's do (.claude/rules/ci-workflows.md).
# - `build-mode: none` means no build step, not no cargo. In the analyze
#   step, CodeQL's Rust extractor (CLI 2.27.3, through rust-analyzer's
#   project model) runs `cargo metadata`, and `cargo check
#   --compile-time-deps`, which compiles and runs build scripts and compiles
#   proc macros. The workspace has none, and no dependencies, so that
#   compiles nothing today. CARGO_NET_OFFLINE (below) keeps cargo from
#   fetching a package if one is added, as in ci.yml.
# - `cargo xtask workflows` checks these rules on every push.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that new queries also look at code that has not changed.
  schedule:
    - cron: "35 9 * * 6"
  workflow_dispatch:

permissions: {}

# ci.yml's rule: a newer run for the same pull request, or the same branch,
# cancels the older one. On main, pushes and the weekly run share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The workspace has no third-party packages, so cargo never needs the
    # network: a registry or git dependency fails here instead of being
    # fetched and built (.claude/rules/ci-workflows.md, "Offline cargo").
    env:
      CARGO_NET_OFFLINE: "true"
    permissions:
      contents: read
      # To upload the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust is read with no build step (see above for the cargo it
        # runs). `actions` is the workflows in .github/workflows: CodeQL's
        # queries catch, among others, injection, untrusted checkouts, cache
        # and artifact poisoning, unpinned third-party actions, and a job
        # with no `permissions:` block. GitHub's own actions pinned by tag,
        # and `write` grants, are caught only by `cargo xtask workflows`.
        language: [rust, actions]

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # security-extended adds the queries of lower precision or severity to
      # the default suite: more to triage, and fewer problems missed.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

# A hand-made seed of the `keymap` fuzz target: exactly 16,384 bytes, the
# target's limit on its TOML, so that one byte more is past it. The rest is
# a comment of padding.
version = 1
start = "insert"

[keymap.insert]
"ctrl+b" = "view.toggleSidePanel"

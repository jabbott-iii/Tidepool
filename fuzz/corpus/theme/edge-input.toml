bar = { value = "rgba(30,37,40,0.72)", solid = "#191e20", ansi = 234 }
on-amber = { value = "#111111" }
on-teal = { value = "#071012" }
comment = { value = "#6f7d82" }
ghost = { value = "rgba(255,255,255,0.03)", solid = "#121314", ansi = 233 }
teal-line = { value = "rgba(92,203,203,0.55)", solid = "#387576", ansi = 66 }
teal-fill = { value = "rgba(92,203,203,0.20)", solid = "#1b3233", ansi = 235 }
slate-hi = { value = "#34444a", ansi = 238 }
